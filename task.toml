name = "depot-incidents"

# The verifier reads only these paths from the agent's final environment. Must stay top-level:
# nested under [verifier] the value is silently dropped and the verifier receives nothing.
artifacts = [
    "/app/watch/src/",
    "/app/watch/build.sh",
    "/app/data/",
    "/app/out/",
]

[metadata]
author_name = "anonymous"
author_email = "anonymous"
category = "Operations"
subcategory = "Logistics"
tags = ["pascal", "safety", "incident-log", "ranking", "depots"]
languages = ["pascal"]
difficulty = "core"
expert_time_estimate_hours = 3

difficulty_explanation = """
The safety memo ranks 180 depots by logged incidents per hour worked over five years and proposes the top thirty for the programme. Every figure in that table is arithmetically right. What it measures is not what the memo thinks it measures, because a depot only appears in the log to the extent that its people write things down. The README states how the log is filled in: a fixed share of incidents at any depot are severe, every severe one is entered by the regional lead and carries an insurer claim, and minor incidents are entered by the depot itself at whatever rate that depot logs them. In the shipped network that rate runs from essentially never to essentially always, with a median around half, so a wall-book depot with a genuinely bad rate can sit mid-table while an app depot with a mild one sits near the top. The league table is a ranking of paperwork as much as of risk.

The product is the list itself: which depots go on the programme, scored on what they actually log in the programme year once every incident goes through the app and the count is complete. The bar is the incidents per hour worked at the listed depots over that year divided by the figure for the whole network, and it is 1.65 on the Southern network and 1.60 on the Northern. The memo's own thirty come in at 1.433. Ranking by logged count instead of rate gives 1.389, and multiplying the logged rate by the programme year's budgeted hours, which is the memo's expected-incident figure, gives 1.223. Severe incidents per hour worked at the site gives 1.978. Seventeen of the thirty are common to both lists, so the memo is not nonsense, it is thirteen places wrong, and thirteen places is the whole margin. Weighting the severe rate by the programme year's budgeted hours, which ranks by expected count rather than by rate, gives 1.670 and clears the Southern bar; on the Northern network, where the mergers below produced some big combined depots, it lands at 1.452 and misses, which is what the instruction's rate ratio says it should, since the places go where the rate is highest and not where the depot is biggest. The bar separates lists built on the severe rate from lists built on the logged total, which is the distinction the log itself carries.

The second export is the Northern network, 150 depots, twenty places, a different severe share and a different spread of logging habit. Its memo list comes in at 1.217 and its severe-rate list at 1.974, and only three depots are common to the two, so a program that carries the shipped list or the shipped ranking fails there while one that reads the log it is handed passes. Across twelve generated networks per side the memo route clears the bar three times in twelve on the Southern shape and never on the Northern, while the severe route clears it twelve times in twelve on both; the shipped, hidden and third instances are pinned seeds where the separation is clean. The data are synthetic, from solution/gen_incidents.py, and solution/calibrate.py reproduces every figure above.

The register is also written the way a payroll system writes one, and the README of each network says how, as does the instruction. A depot's hours sit in two sets of columns, labour_hours_<year> from payroll for its own staff and agency_hours_<year> from the agency invoices, and a depot's hours are the two together. Four shipped depots run a third or more of their hours on agency staff and none over half, so summing payroll alone still gives 1.983 there; thirty Northern depots run more than half their hours on agency staff, their rate is inflated two to four times when the agency columns are left out, and that list comes in at 1.517. And some depots were folded into another depot in the second year of the log, marked in a merged_into column: from the merge the log carries the site's incidents under the survivor's id, but payroll kept the old cost centre, so the merged depot's hours stay on its own row every year. The two rows are one depot. A program that ranks the rows as they stand gives every survivor the absorbed site's incidents against only its own hours, so its rate is inflated by roughly the size of the site it took over; the merged id itself is deflated and is not a depot the verifier accepts. Two shipped mergers sit outside the top thirty either way, so that program still gives 1.978 there; fifteen Northern mergers put their survivors into the top twenty and that list comes in at 1.525. Across twelve generated networks per side the payroll-only reading never clears the Northern bar and the rows-as-they-stand reading clears it three times, while both clear the Southern bar every time, so each is a mistake a program can carry through the shipped export and only meets on the other one.

The third thing the export carries is where an incident happened. The log's depot column is the depot the injured person is on the books of, because the wall book is that depot's and the regional lead files a severe incident under the person's cost centre, which is the cost centre the insurer's claim is opened against; the site column is the depot where it happened, and the handsets the programme year runs on belong to the site, so the programme year's count is by site. Both README files say so and so does the instruction. The two columns agree on most rows and part company at the hubs, where through the night the yard is mostly trunk drivers from the one depot that runs the hub's trunk routes. The shipped network has four hubs at between a third and a half of what is logged there, and tallying severe incidents under the depot column still gives 1.936 with one place different from the reference. The Northern network has twenty hubs at between seven and nine tenths, and the same program gives 1.317: seven of the twenty reference places are hubs, none of them is in the depot-column list, and eleven of its twenty places go to trunking depots whose own yards are ordinary. The insurer's claims file is opened against the same cost centre, so ranking on it is the same reading and gives the same two figures. A blend that swaps in the pilot year's handset count for that year at the sixty pilot depots, with the depot column used elsewhere, gives 1.943 and 1.449, because the pilot ran at ordinary depots and no hub is in it. Across twelve generated networks the depot-column reading clears the Southern bar every time, averaging 1.842, and never clears the Northern one, averaging 1.269 with a best of 1.406, and the blend clears the Northern bar once.

The implementation is small: two csv reads, a per-depot tally, a division and a partial sort, in Free Pascal against the run-time units with the JSON written by hand. The difficulty is in reading the export: which column of the log is complete, which column says where an incident happened, and what a depot and its hours are in the register. A correct, careful program that ranks the league table the memo ranks produces a list that misses the bar by a fifth on one network and by a third on the other.

This is the job of a safety analyst or the operations manager who owns a programme budget, and mistaking reporting rate for incident rate is the classic way that budget lands in the wrong depots. Regulators and insurers use claim counts for exactly this reason.
"""

solution_explanation = """
The reference (solution/solve.sh) installs src/watch.pas and runs the project's build script, then runs the binary on /app/data. It reads policy.json for the log years, the programme year and the number of places, tallies the incident log per depot at the site where each incident happened rather than under the depot column, sums the hours worked per depot over the log years from the register, payroll and agency columns together, and folds each row the register marks merged_into another into that depot, hours and incidents both, dropping the merged id. The fold resolves merged_into to whichever depot is still standing rather than stopping at the first hop, so a chain of mergers pools correctly wherever one appears. The shipped, hidden and third registers hold no such chain, since the generator draws every absorbed id and every surviving id once each, from the same pool, before pairing them up, so a depot already named as a survivor can never also be drawn as one to absorb; the fold is written to get a chain right anyway rather than relying on the data staying that way.

The ranking is severe incidents at the site over the log years divided by hours worked over the log years, and the top list_size depots go on the list. Nothing else is weighted in. The insurer's claims file has one row per severe incident but is opened against the cost centre of the person hurt, so it carries the depot column and not the site, and a ranking built on it is the depot-column ranking, not this one. Output is one JSON object with the single key depots, written by hand since the run-time units carry no serialiser.

On the shipped network that list runs at 1.978 times the network's rate in the programme year against a bar of 1.65, and on the Northern network at 1.974 against 1.60. The wrong routes are each one changed expression in the same program: ranking by every logged incident on a depot's books per hour, the memo's league table, gives 1.433 and 1.217, multiplying that rate by the programme year's budgeted hours gives 1.223 and 1.007, tallying severe incidents under the depot column instead of the site gives 1.936 and 1.317, summing the payroll columns without the agency ones gives 1.983 and 1.517, and ranking the register's rows as they stand with merged_into ignored gives 1.978 and 1.525.
"""

verification_explanation = """
The verifier runs in its own container. It collects the agent's Pascal sources, the build script and the shipped export as artifacts, compiles src/watch.pas itself with fpc as an unprivileged build user, and runs the binary it produced, so the graded list always comes out of a clean build of the agent's own code. The agent's build script is not run: a script that produced the list some other way would otherwise pass with the stub still in place. Object files are directed to their own directory so nothing lands beside the sources.

Compiling and running means the verifier executes code the agent wrote, so it does not do that as root. test.sh hands the project to the build user through setpriv with supplementary groups cleared and no-new-privileges set, runs the binary from /app/watch, the directory the instruction documents, and while it runs every executable on the system paths is closed to that user, found by walking those directories rather than by keeping a list, so the ranking cannot come out of a Python or an awk the binary shells out to; the cheat_python_shim arm is that construction and scores 0. Closing the system paths is not sufficient on its own, because a helper binary shipped inside the project directory would still be runnable, so before each graded run every file under /app/watch except the binary just built has its execute bits stripped. Each run happens in its own session and its process group is torn down afterwards, then every process that user still owns is swept, so nothing the agent started is alive when the reward is written. The three runs are each given a different output path, so a program that writes a fixed destination rather than the path it is handed loses every run after the first. Output is staged only if it is a regular file, moved to a root-owned path, and pytest reads it with O_NOFOLLOW; pytest never runs the agent's binary. The keys live under /opt, readable only by root, and the /tests mount is closed to the build user before anything untrusted starts; if either is still reachable the run is abandoned with reward 0. pytest is called by full path with -P so nothing dropped into the working directory can shadow it.

Then the same binary is run on the Northern network's export and a third, Western network's export, each staged into a freshly named directory only after the build has finished and its processes are gone, with its own README beside it, and removed afterwards. The Northern network has 150 depots against 180, twenty places against thirty, a different severe share and a different spread of logging habit; the Western has 130 depots, twenty five places and its own share and spread again. Nothing in the policy is the same across all three: the log runs 2020 to 2024 on the Southern export, 2018 to 2022 on the Northern and 2019 to 2023 on the Western, the programme year is 2025, 2023 and 2024 in turn, the list is thirty, twenty and twenty five, and the rate bar is 1.65, 1.60 and 1.62. Neither a constant nor a count read off depots.csv survives past the first run, and a program that tells the fixed exports apart by a policy value and answers each from a list pasted into the source, rather than from that run's own data, has no branch defined for the third network's values and fails there: cheat_two_lists is exactly that program, keyed on programme_year, and it scores 0 because 2024 matches neither of the two years it recognises.

Seven checks run and every one is a requirement instruction.md states. The six shipped files, README.md included, are unaltered by sha256, so an unhashed and still-readable file cannot be used to smuggle a payload into a run. On each of the three graded runs the output is one object with exactly the key depots, the list holds exactly the policy's list_size depot ids drawn from that run's register, none of them marked merged into another, with no repeats, and over the programme year the incidents per hour worked at the listed depots, payroll and agency hours together and a merged row folded into its survivor as instruction.md defines a depot and its hours, come to at least the policy's minimum_rate_ratio times the figure for the whole network. A merged id is not a depot of the export and is rejected by name. That count is the key: what each depot logged in the programme year once logging was mandatory, a count per depot the binary never sees, so the bar is a performance bar on the agent's list against labels the verifier holds rather than a comparison against a private estimate.

The report used to carry a second figure, an estimate of the pilot year for depots whose app total the export held back, and it is gone. Graded as a total across those depots it could be satisfied without reading the log at all: handing every one of them the average of the published pilot depots came within three percent on the shipped network and inside the tolerance on the other, so a submission that never opened incidents.csv passed that half of the report. Grading it depot by depot was not the answer either, because one depot-year carries too few severe incidents for any correct method to hit a tight figure. Taking it out leaves the list, which is what the task is about, and the list cannot be produced without the same reading of the log.

The export still carries pilot_year.csv, for all sixty depots that ran the app beside the wall book for a year. It is evidence rather than an input: it is the one place where what a depot logged and what actually happened sit side by side, so a reading of the log can be checked against it before it is used on the rest of the network. Nothing in the job needs a figure out of it. Every list bar is measured rather than chosen: across twelve generated networks the severe rate averages 1.889 on the Southern shape, 1.795 on the Northern and 1.734 on the Western and clears its bar on every one of the twelve on all three, as does the generator's own rate, while the memo's ranking averages 1.597, 1.253 and 1.411 and clears it on three of twelve on the Southern shape, none on the Northern and one on the Western. The shipped instances sit at 1.433 against 1.978, 1.217 against 1.974 and 1.346 against 1.803, so the reading the task is about is the one that passes on the export a solver actually reads. The Southern bar stays at 1.65 rather than going higher because weighting the severe rate by budgeted hours lands at 1.670 there, and a list built on the severe signal should not fail on the Southern export for ranking by count. Ten arms run through the real verifier and each scores 0, and each fails on its own mechanism rather than on the output shape: oracle_league_table, the memo's ranking, and oracle_logged_x_hours, the logged rate turned into an expected count, both fail the programme-year rate on every run and nothing else; oracle_payroll_hours, the reference summing the payroll columns without the agency ones, oracle_rows_apart, the reference ranking every register row as its own depot with merged_into ignored, and oracle_home_depot, the reference tallying severe incidents under the depot column instead of the site, each pass the shipped run whole and fail the Northern run on the rate alone; cheat_frozen_list writes the shipped answer into the source, passes the shipped run whole and fails the Northern one on the list shape and the rate together; cheat_dlopen_readme plants a real ELF over the README and has the binary call LoadLibrary on it, and fails the same file hash check that now covers all six shipped files regardless of what the load does; cheat_python_shim hands the job to a Python script and produces nothing, as does the do-nothing arm; and cheat_two_lists embeds the shipped and hidden qualifying lists and dispatches on programme_year, passing those two runs whole and failing the Western run's list shape since it recognises neither 2024 nor any other year. The oracle and an oracle with every artifact back-dated both score 1. solution/gen_incidents.py regenerates all three exports and all three keys byte for byte, the Southern network with no arguments, the Northern with --hidden and the Western with --third.
"""

relevant_experience = """
I have written a run of tasks for this edition, a number of them accepted, around one observation: the tasks that measure anything are the ones where the agent's own careful work confirms the wrong answer. Here the wrong answer is a league table that is arithmetically perfect and answers a different question, and the fix is not a better model but noticing which column of the log is complete. I have built the operational version of this before, where a reported rate and a real rate diverge because the reporting is voluntary, and the giveaway is always a severity split or an external file that does not depend on anyone choosing to fill a form in.
"""

[verifier]
# One compile and two runs of the agent's program. fpc is fast and there is no dependency tree,
# but 1800 is the floor the platform requires.
timeout_sec = 1800
environment_mode = "separate"
network_mode = "no-network"

[agent]
timeout_sec = 5400
# Offline by design: the tool is written against the Free Pascal run-time units, and network
# access would let the agent pull a package rather than read the log.
network_mode = "no-network"

[environment]
# Must be "public" on every task, offline ones included: this is the phase where the image is
# built and the agent harness is installed.
network_mode = "public"
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240
