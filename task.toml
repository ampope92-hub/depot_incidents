name = "depot-incidents"

# The verifier reads only these paths from the agent's final environment. Must stay top-level:
# nested under [verifier] the value is silently dropped and the verifier receives nothing.
artifacts = [
    "/app/watch/src/",
    "/app/watch/build.sh",
    "/app/data/",
    "/app/out/",
]

[metadata]
author_name = "anonymous"
author_email = "anonymous"
category = "Operations"
subcategory = "Logistics"
tags = ["pascal", "safety", "incident-log", "ranking", "depots"]
languages = ["pascal"]
difficulty = "core"
expert_time_estimate_hours = 3

difficulty_explanation = """
The safety memo ranks 180 depots by logged incidents per hour worked over five years and proposes the top thirty for the programme. Every figure in that table is arithmetically right. What it measures is not what the memo thinks it measures, because a depot only appears in the log to the extent that its people write things down. The README states how the log is filled in: a fixed share of incidents at any depot are severe, every severe one is entered by the regional lead and carries an insurer claim, and minor incidents are entered by the depot itself at whatever rate that depot logs them. In the shipped network that rate runs from essentially never to essentially always, with a median around half, so a wall-book depot with a genuinely bad rate can sit mid-table while an app depot with a mild one sits near the top. The league table is a ranking of paperwork as much as of risk.

The product is the list itself: which depots go on the programme, scored on what they actually log in the programme year once every incident goes through the app and the count is complete. The bar is the incidents per hour worked at the listed depots over that year divided by the figure for the whole network, and it is 1.65 on the Southern network and the same on the Northern. The memo's own thirty come in at 1.390. Ranking by logged count instead of rate gives 1.170, and multiplying the logged rate by the programme year's budgeted hours, which is the memo's expected-incident figure, gives 1.137. Severe incidents per hour worked at the site gives 1.970. Fifteen of the thirty are common to both lists, so the memo is not nonsense, it is fifteen places wrong, and fifteen places is the whole margin. Weighting the severe rate by the programme year's budgeted hours, which ranks by expected count rather than by rate, gives 1.421 on the Southern network and 1.378 on the Northern one and misses both, which is what the instruction's rate ratio says it should, since the places go where the rate is highest and not where the depot is biggest. The bar separates lists built on the severe rate from lists built on the logged total, which is the distinction the log itself carries.

The second export is the Northern network, 150 depots, twenty places, a different severe share and a different spread of logging habit. Its memo list comes in at 1.264 and its severe-rate list at 1.924, and only three depots are common to the two, so a program that carries the shipped list or the shipped ranking fails there while one that reads the log it is handed passes. Across twelve generated networks per side the memo route clears the bar once in twelve on the Southern shape and never on the Northern, while the severe route clears it twelve times in twelve on the Southern shape and eleven times in twelve on the Northern; the shipped, hidden and third instances are pinned seeds where the separation is clean. The data are synthetic, from solution/gen_incidents.py, and solution/calibrate.py reproduces every figure above.

The register is also written the way a payroll system writes one, and the README of each network says how, as does the instruction. A depot's hours sit in two sets of columns, labour_hours_<year> from payroll for its own staff and agency_hours_<year> from the agency invoices, and a depot's hours are the two together. Four shipped depots run a third or more of their hours on agency staff and none over half, so summing payroll alone still gives 1.975 there; thirty Northern depots run more than half their hours on agency staff, their rate is inflated two to four times when the agency columns are left out, and that list comes in at 1.625. And some depots were folded into another depot in the second year of the log, marked in a merged_into column: from the merge the log carries the site's incidents under the survivor's id, but payroll kept the old cost centre, so the merged depot's hours stay on its own row every year. The two rows are one depot. A program that ranks the rows as they stand gives every survivor the absorbed site's incidents against only its own hours, so its rate is inflated by roughly the size of the site it took over; the merged id itself is deflated and is not a depot the verifier accepts. Every register carries one consolidation that ran through a cluster of yards rather than a single pairing, eleven rows on the Southern network ending at D108, eight on the Northern ending at D077 and seven on the Western ending at D023, so a row's merged_into can name a yard that is itself merged and has to be followed to the id left standing. Reading the rows as they stand gives 1.545, 1.381 and 1.446 and misses every bar; following merged_into a single hop leaves most of a cluster's hours on rows that are not depots any more, which makes the yard left standing look small and busy, and that reading gives 1.566, 1.502 and 1.536 against bars of 1.65, 1.65 and 1.62, so it misses all three as well. Taking the hours from the payroll columns alone clears the Southern bar at 1.975 and misses the Northern at 1.625 against 1.65, and across twelve generated networks per side it never clears the Northern bar, so it is a mistake a program can carry through the shipped export and meet on another one.

The third thing the export carries is where an incident happened. The log's depot column is the depot the injured person is on the books of, because the wall book is that depot's and the regional lead files a severe incident under the person's cost centre, which is the cost centre the insurer's claim is opened against; the site column is the depot where it happened, and the handsets the programme year runs on belong to the site, so the programme year's count is by site. Both README files say so and so does the instruction. The two columns agree on most rows and part company at the hubs, where through the night the yard is mostly trunk drivers from the one depot that runs the hub's trunk routes. The shipped network has four hubs at between a third and a half of what is logged there, and tallying severe incidents under the depot column still gives 1.939 with two places different from the reference. The Northern network has twenty hubs at between seven and nine tenths, and the same program gives 1.429: six of the twenty reference places are hubs, none of them is in the depot-column list, and fourteen of its twenty places go to trunking depots whose own yards are ordinary. The insurer's claims file is opened against the same cost centre, so ranking on it is the same reading and gives the same two figures. A blend that swaps in the pilot year's handset count for that year at the sixty pilot depots, with the depot column used elsewhere, gives 1.553 and 1.303, because the pilot ran at ordinary depots and no hub is in it. Across twelve generated networks the depot-column reading clears the Southern bar every time, averaging 1.823, and never clears the Northern one, averaging 1.258 with a best of 1.468, and the blend never clears the Northern bar.

The implementation is small: two csv reads, a per-depot tally, a division and a partial sort, in Free Pascal against the run-time units with the JSON written by hand. Each network's README carries the safety team's own method in words, so two careful readers cannot end up with different estimators: the figure a depot is ranked on is its severe incidents at the site over the hours it worked across the log years, merged rows folded in first, counts taken as they stand, the severe share never estimated and never used to scale a count up, and the pilot file used to check a reading rather than to make one. What is left is the export itself: which column of the log is complete, which column says where an incident happened, and what a depot and its hours are in a register that keeps old cost centres and chains one merger into the next. A correct, careful program that ranks the league table the memo ranks produces a list that misses the bar by a sixth on one network and by a quarter on the other.

This is the job of a safety analyst or the operations manager who owns a programme budget, and mistaking reporting rate for incident rate is the classic way that budget lands in the wrong depots. Regulators and insurers use claim counts for exactly this reason.
"""

solution_explanation = """
The reference (solution/solve.sh) installs src/watch.pas and runs the project's build script, then runs the binary on /app/data. It decodes policy.json with fpjson, the JSON unit that ships with Free Pascal, and takes the log years and the number of places from the decoded object, so spacing, key order and string escapes in the file are left to the parser; it ranks on the assumption the comment at its head states, that a depot's rate does not move from one year to the next so the severe rate over the logged years is the rate it will be running at in the programme year; it reads programme_year and minimum_rate_ratio as well, since the list is held to a rate over the hours the register budgets for that year. It reads the incident log a line at a time rather than holding it in memory, since nothing in the tally needs more than the row in hand, and counts each incident at the site where it happened rather than under the depot column, sums the hours worked per depot over the log years from the register, payroll and agency columns together, and folds each row the register marks merged_into another into that depot, hours and incidents both, dropping the merged id. The fold resolves merged_into to whichever depot is still standing rather than stopping at the first hop, so a chain of mergers pools correctly wherever one appears. Every one of the three registers carries a chain: a consolidation that ran through a cluster of yards, eleven rows on the Southern network, eight on the Northern and seven on the Western, each folded into the next one along and ending at the one yard left standing, alongside the ordinary straight pairings. The fold reads every row's own figures once and adds them to the end of its chain, so the order the rows come in and the length of the chain make no difference.

The ranking is severe incidents at the site over the log years divided by hours worked over the log years, and the top list_size depots go on the list. Nothing else is weighted in. The register carries whole hours, so they are added up as whole numbers and two depots are compared as a whole count over whole hours, by the whole part of each rate and then by what is left over, rather than by their divided rates or by any product of a count and an hours figure, which for large enough hours would not fit: two depots on exactly the same rate come out level however large the hours behind them are, and the lower id takes the place, which is what the method sheet in each README says. Only the climb below, which ranks on a weighted score rather than on a rate, compares real numbers. That list is then held against the bar it has to clear, each depot's rate against the hours the register budgets for it in the programme year: on every export here the ranking clears it with room and the list is written as it stands, and where the highest rates would not clear it, because one large depot on a middling rate carries enough hours to pull a list under while a smaller one just behind it leaves it clear, the strongest list of that size is taken instead, found by ranking on hours times rate less the rate the list is running at and taking that list's own rate as the next one, which climbs to the best list of that size in a few passes. The insurer's claims file has one row per severe incident but is opened against the cost centre of the person hurt, so it carries the depot column and not the site, and a ranking built on it is the depot-column ranking, not this one. Output is one JSON object with the single key depots, written out directly, each id JSON-escaped as it is copied so a quote, backslash or control character in an id could not break the object.

On the shipped network that list runs at 1.970 times the network's rate in the programme year against a bar of 1.65, and on the Northern network at 1.924 against the same bar. The wrong routes are each one changed expression in the same program: ranking by every logged incident on a depot's books per hour, the memo's league table, gives 1.390 and 1.264, multiplying that rate by the programme year's budgeted hours gives 1.137 and 1.095, tallying severe incidents under the depot column instead of the site gives 1.939 and 1.429, summing the payroll columns without the agency ones gives 1.975 and 1.625, and ranking the register's rows as they stand with merged_into ignored gives 1.545 and 1.381.
"""

verification_explanation = """
The verifier runs in its own container. It collects the agent's Pascal sources, the build script and the shipped export as artifacts, compiles src/watch.pas itself with fpc as an unprivileged build user, and runs the binary it produced, so the graded list always comes out of a clean build of the agent's own code. The agent's build script is not run: a script that produced the list some other way would otherwise pass with the stub still in place. Object files are directed to their own directory so nothing lands beside the sources. Everything collected under src/ comes along to the build whatever its name: a Free Pascal unit is not always a .pas and a text include is not always an .inc, and deleting by extension threw away contract-legal source before fpc ever ran, so nothing under src/ is removed on account of its name. build.sh alone is removed, a declared artifact collected into /app/watch and never sourced by the verifier, so it cannot be handed to the linker as an object. What keeps non-Pascal machine code out of the binary is the link stage itself: fpc is run with -Cn, which compiles the Pascal to objects and writes the link script it would hand to ld but stops before the link, and that script is read. A correct project names only the objects fpc itself produced under obj/ and the run-time units under the fpc directory, so an {$L}, {$linklib} or {$librarypath} directive naming anything else, whatever its name, extension or content, appears there as an extra INPUT entry and the link is refused. This reads the link inputs fpc resolved rather than scanning the Pascal source, so a payload renamed to .inc, shipped as build.sh, or written as a text linker script rather than an object, has no way past it; instruction.md states that the binary is built from the Pascal under src and nothing else of the agent's, and that nothing else on the box can be started while it runs; those two sentences are the contract, each enforced as described here, and inline machine code inside the agent's own Pascal is not outside either of them. oracle_with_include is a src/watch.pas split across a .pas file and a same-directory .inc, oracle_pp_unit lifts a routine into an ordinary unit src/depotmath.pp pulled in with uses, and oracle_named_include carries its text include as src/tables.txt rather than tables.inc; all three build and score 1 on every network, proving that keeping every file under src does not false-reject an ordinary Pascal project split across more than one source file. cheat_linked_object is the link-target construction, built for real with a working helper.o that does the ranking and a src/watch.pas that declares it external and pulls it in with {$link helper.o}; the object stays on disk under src now, but it appears in the link script as an INPUT fpc did not produce, so the link is refused and no binary is built. cheat_linked_object_out is the same object placed under /app/out, a declared artifact emptied before fpc ever runs, so it is not even on disk, and the link check would refuse it in any case. cheat_link_inc ships that same helper.o as src/helper.inc and links it with {$L /app/watch/src/helper.inc}, and cheat_link_buildsh ships it as build.sh and links it with {$L /app/watch/build.sh}; both scored 1 under the earlier one-shot compile and score 0 now, the first refused because helper.inc is an INPUT fpc did not produce, the second because build.sh is removed before the compile and would be refused at the link in any case.

Compiling and running means the verifier executes code the agent wrote, so it does not do that as root. test.sh hands the project to the build user through setpriv with supplementary groups cleared and no-new-privileges set, runs the binary from /app/watch, the directory the instruction documents, and while it runs every executable on the system paths is closed to that user, found by walking those directories rather than by keeping a list, so the ranking cannot come out of a Python or an awk the binary shells out to; the cheat_python_shim arm is that construction and scores 0. The export is served to that unprivileged user read-only, chmod a-w before any agent code runs, so a solution has to open its inputs for reading only, an environmental fact instruction.md now states; oracle_reset_rw is the reference reading through an untyped Reset, which Free Pascal opens read/write, and it dies with Access denied on every run under that regime and scores 0 while the shipped reference's read-only open scores 1. Closing the system paths is not sufficient on its own, because a helper binary shipped inside the project directory would still be runnable, so before each graded run every file under /app/watch except the binary just built has its execute bits stripped, and the run is given no writable directory at all in which to create a fresh one: /app, the build user's home and the world-writable temp directories are all closed to it, and each run's output is a single root-owned regular file at mode 0666, so an ordinary Pascal creation route opens it read/write and writes the report in place -- a text Rewrite, a TStringList.SaveToFile or a TFileStream with fmCreate all work, and oracle_filestream_create, which uses the fmCreate stream, scores 1 -- while the runner cannot chmod, rename or replace the file and no sibling temporary file can be created beside it, because the runner does not own the file and the root-owned directory holding it is not writable, so a temporary-file-and-rename publish has nowhere to put its sibling and nothing the run writes can carry an execute bit; instruction.md states that the output path is already there to write straight into and there is nowhere else on the box to write. oracle_temp_rename is that atomic publish, writing a sibling .tmp and renaming it over the path, and it scores 0 because the sibling cannot be created and the pre-created output stays empty. The launcher's filter refuses clone, fork and vfork as well, so the job cannot be handed to worker processes running beside the binary: cheat_fork_worker is the reference with the whole job moved into a forked child and the parent waiting on it, and the fork is refused on every run, so it halts and writes nothing. The dynamic loader is the one executable left open to the build user, because closing a file every running process has mapped makes the storage driver copy it up underneath them and the next exec fails with an I/O error; what a loader call could carry is closed at the other end instead, since with clone refused an exec replaces the program that would have written the answer, and the only file a run can write is the file the loader would have to be handed, so truncating it to write the JSON kills the process on its own mapping and leaves the output empty, which is what happens when that construction is run in this image. The build itself gets the 900 seconds the environment declares, compile and link together, and a build that runs past it is stopped with a message rather than absorbing the verifier's own timeout. cheat_embedded_helper embeds the reference itself as a native ELF and tries to write it into a writable directory, mark it executable and run it in place of doing the work in Pascal; it scored 1 while /app/out was writable to the build user and scores 0 now that no directory is, producing no output on any run. The one route to native code that needs no file at all, an anonymous executable created in memory with memfd_create and run with fexecve, is closed by a small launcher that wraps each run in a seccomp filter denying those calls; the binary is started through it, its ordinary file work untouched, so cheat_memfd_helper, which embeds the same reference ELF and runs it that way, scores 1 against a run without the launcher and 0 under it, memfd_create refused and nothing written. Each run happens in its own session and its process group is torn down afterwards, then every process that user still owns is swept, so nothing the agent started is alive when the reward is written. The three runs are each given a different output path, so a program that writes a fixed destination rather than the path it is handed loses every run after the first. Output is staged only if it is a regular file, moved to a root-owned path, and pytest reads it with O_NOFOLLOW; pytest never runs the agent's binary. The keys live under /opt, readable only by root, and the /tests mount is closed to the build user before anything untrusted starts; if either is still reachable the run is abandoned with reward 0. pytest is called by full path with -P so nothing dropped into the working directory can shadow it.

Then the same binary is run on the Northern network's export and a third, Western network's export, each staged root-owned and read-only into a freshly named directory only after the build has finished and its processes are gone, with its own README beside it, and removed afterwards; the staged files are root-owned mode 0444 in a root-owned directory, so the unprivileged runner reads every one but owns none and cannot chmod its own copy back to alter a read-only input. The Northern network has 150 depots against 180, twenty places against thirty, a different severe share and a different spread of logging habit; the Western has 130 depots, twenty five places and its own share and spread again. Nothing in the policy is the same across all three: the log runs 2020 to 2024 on the Southern export, 2018 to 2022 on the Northern and 2020 to 2023 on the Western, the programme year is 2025, 2023 and 2024 in turn, the list is thirty, twenty and twenty five, and the rate bar is 1.65, 1.65 and 1.62. Neither a constant nor a count read off depots.csv survives past the first run, and a program that tells the fixed exports apart by a policy value and answers each from a list pasted into the source, rather than from that run's own data, has no branch defined for the third network's values and fails there: cheat_two_lists is exactly that program, keyed on programme_year, and it scores 0 because 2024 matches neither of the two years it recognises. The Western register also carries a different number of years: four of the log beside the programme year where the other two carry five, so the columns of a register follow that export's own log years and the pair for the programme year does not sit at a fixed position, which is what the README of each export says and what a policy-driven reader gets right on all three. The Northern policy.json is the one its own team's tool wrote, no indentation, the keys in another order and one of them spelled with a JSON string escape; it decodes to the same object the shipped one is written as, and instruction.md says the policy JSON is not always laid out the way the shipped one is. The Western policy holds its keys in the Western team's own order, with the rate bar sitting between the programme year and the number of places, so the two values that sit next to each other on the shipped and Northern exports do not there: oracle_adjacent_policy is the reference with one change, a reader that finds programme_year in the text and takes the next number for the list size rather than looking the key up, and it reads 30 and 20 on the first two runs and the rate bar 1.62 on the Western one, listing a single depot where twenty five are asked for, so it scores 0 on that run's list shape alone. oracle_literal_policy is the reference as it stood before this reader, searching the policy text for the literal key name and taking the digits after it; it passes the shipped and Western runs and scores 0 on the Northern one, finding no list_size and writing nothing, while the reference decodes it and scores 1.

Seven checks run and every one is a requirement instruction.md states. The six shipped files, README.md included, are unaltered by sha256, so an unhashed and still-readable file cannot be used to smuggle a payload into a run. On each of the three graded runs the output is one object with exactly the key depots, the list holds exactly the policy's list_size depot ids drawn from that run's register, none of them marked merged into another, with no repeats, and over the programme year the incidents per hour worked at the listed depots, payroll and agency hours together and a merged row folded into the depot left standing at the end of its chain of mergers, as instruction.md and the README define a depot and its hours, come to at least the policy's minimum_rate_ratio times the figure for the whole network. The verifier resolves merged_into all the way itself rather than a single hop, which is what every register now needs: each of the three carries one consolidation that ran through a cluster of yards, eleven rows on the Southern network, eight on the Northern and seven on the Western, so a row can name a yard that is itself merged. A merged id is not a depot of the export and is rejected by name. That count is the key: what each depot logged in the programme year once logging was mandatory, a count per depot the binary never sees, so the bar is a performance bar on the agent's list against labels the verifier holds rather than a comparison against a private estimate.

The report used to carry a second figure, an estimate of the pilot year for depots whose app total the export held back, and it is gone. Graded as a total across those depots it could be satisfied without reading the log at all: handing every one of them the average of the published pilot depots came within three percent on the shipped network and inside the tolerance on the other, so a submission that never opened incidents.csv passed that half of the report. Grading it depot by depot was not the answer either, because one depot-year carries too few severe incidents for any correct method to hit a tight figure. Taking it out leaves the list, which is what the task is about, and the list cannot be produced without the same reading of the log.

The export still carries pilot_year.csv, for all sixty depots that ran the app beside the wall book for a year. It is evidence rather than an input: it is the one place where what a depot logged and what actually happened sit side by side, so a reading of the log can be checked against it before it is used on the rest of the network. Nothing in the job needs a figure out of it. Every list bar is measured rather than chosen: across twelve generated networks the severe rate averages 1.867 on the Southern shape, 1.757 on the Northern and 1.718 on the Western and clears its bar on twelve of the twelve on the Southern shape, eleven of the twelve on the Northern and ten of the twelve on the Western, as does the generator's own rate at the same counts, while the memo's ranking averages 1.573, 1.243 and 1.377 and clears it once in twelve on the Southern shape, never on the Northern and never on the Western. The shipped instances sit at 1.390 against 1.970, 1.264 against 1.924 and 1.368 against 1.826, so the reading the task is about is the one that passes on the export a solver actually reads. The Southern bar stays at 1.65 because the reference clears it on every one of the twelve generated networks with room to spare while the closest wrong route, weighting the severe rate by budgeted hours, only reaches 1.421 there, and a list built on the severe signal should not need a higher bar to stay ahead of routes built on the logged total or the depot column. Twenty two arms run through the real verifier and each scores 0, and each fails on its own mechanism rather than on the output shape: cheat_linked_object ships a working helper.o and a src/watch.pas that declares an external routine and links it in with {$link helper.o} under src/; the routine does the real ranking, and the arm read reward 1 against the earlier one-shot compile, then reward 0 now because the object appears in the link script fpc writes as an INPUT the compiler did not produce and the link is refused, not because the output is malformed. cheat_linked_object_out is the same helper.o and the same declare-and-link shim, but the object rides in under /app/out instead, a declared artifact emptied ahead of the build, so it is not on disk and the link is refused in any case. oracle_league_table, the memo's ranking, and oracle_logged_x_hours, the logged rate turned into an expected count, both fail the programme-year rate on every run and nothing else; oracle_payroll_hours, the reference summing the payroll columns without the agency ones, oracle_rows_apart, the reference ranking every register row as its own depot with merged_into ignored, which now misses on every run at 1.545, 1.381 and 1.446, oracle_one_hop, the reference following merged_into a single hop instead of to the yard left standing, so a cluster's hours are left on rows that are not depots and its survivor is ranked as a small busy yard, which gives 1.566, 1.502 and 1.536 and misses every run, and oracle_home_depot, the reference tallying severe incidents under the depot column instead of the site, which passes the shipped run whole and fails the Northern and Western runs on the rate alone; cheat_frozen_list writes the shipped answer into the source, passes the shipped run whole and fails the Northern one on the list shape and the rate together; cheat_dlopen_readme plants a real ELF over the README and has the binary call LoadLibrary on it, and fails the same file hash check that now covers all six shipped files regardless of what the load does; cheat_python_shim hands the job to a Python script and produces nothing, as does the do-nothing arm; and cheat_two_lists embeds the shipped and hidden qualifying lists and dispatches on programme_year, passing those two runs whole and failing the Western run's list shape since it recognises neither 2024 nor any other year; cheat_link_inc and cheat_link_buildsh ship that same working helper.o as src/helper.inc and as build.sh and link it in, and are refused at the link-input check with no binary produced; cheat_embedded_helper embeds the reference as a native ELF and tries to drop and execute it at run time, and scores 0 because the run has no writable directory to drop it in; cheat_memfd_helper embeds that same ELF and runs it from an anonymous in-memory file with memfd_create and fexecve, needing no directory, and scores 0 because the seccomp filter the launcher installs denies memfd_create so nothing is ever written or run; oracle_reset_rw is the reference opening its inputs with an untyped read/write Reset, which dies with Access denied on the read-only export and writes nothing; oracle_temp_rename is the reference publishing atomically through a sibling temporary file and a rename, which cannot create that sibling in the root-owned output directory and leaves the pre-created output empty on every run; oracle_literal_policy is the reference with its old text-search policy reader, which finds no list_size in the Northern policy and writes nothing on that run; oracle_adjacent_policy is the reader that takes the number after programme_year for the list size and lists one depot on the Western export, where the rate bar sits between the two keys; and cheat_fork_worker moves the job into a forked child, which the launcher's filter refuses, so it halts with no worker and writes nothing on any run. The oracle, an oracle with every artifact back-dated, the ordinary multi-file Pascal projects built by oracle_with_include, oracle_pp_unit and oracle_named_include, oracle_filestream_create, which writes the report through an fmCreate stream, and oracle_unordered_list, which is the reference with the chosen list written out back to front, all score 1. The last of those is the order: which depots get a place is graded, the order the ids are written in is not, instruction.md says so in the sentence that gives the schema, and no check reads it, so an implementation that sorts its ids for a stable output or reverses them scores exactly what the reference scores. solution/gen_incidents.py regenerates all three exports and all three keys byte for byte, the Southern network with no arguments, the Northern with --hidden and the Western with --third.
"""

relevant_experience = """
I have written a run of tasks for this edition, a number of them accepted, around one observation: the tasks that measure anything are the ones where the agent's own careful work confirms the wrong answer. Here the wrong answer is a league table that is arithmetically perfect and answers a different question, and the fix is not a better model but noticing which column of the log is complete. I have built the operational version of this before, where a reported rate and a real rate diverge because the reporting is voluntary, and the giveaway is always a severity split or an external file that does not depend on anyone choosing to fill a form in.
"""

[verifier]
# One compile and two runs of the agent's program. fpc is fast and there is no dependency tree,
# but 1800 is the floor the platform requires.
timeout_sec = 1800
environment_mode = "separate"
network_mode = "no-network"

[agent]
timeout_sec = 5400
# Offline by design: the tool is written against the Free Pascal run-time units, and network
# access would let the agent pull a package rather than read the log.
network_mode = "no-network"

[environment]
# Must be "public" on every task, offline ones included: this is the phase where the image is
# built and the agent harness is installed.
network_mode = "public"
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240
